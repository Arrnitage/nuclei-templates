name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git
          git fetch upstream

      - name: Merge upstream
        run: |
          git checkout main
          git merge upstream/main

      - name: Push changes
        run: |
          git push origin main
